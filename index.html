
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>降伏十魔軍｜憂愁魔・雨中城鎮</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&display=swap');

* { box-sizing:border-box; }

body {
  margin:0;
  overflow:hidden;
  background:#101927;
  color:#e5edf5;
  font-family:'Noto Serif TC',serif;
}

canvas {
  display:block;
}

#hud {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:5;
}

#top {
  position:absolute;
  top:24px;
  left:28px;
  right:28px;
  display:flex;
  justify-content:space-between;
  font-size:12px;
  letter-spacing:3px;
  text-shadow:0 2px 8px #000;
}

#crosshair {
  position:absolute;
  left:50%;
  top:50%;
  width:6px;
  height:6px;
  border:1px solid #ffffffaa;
  border-radius:50%;
  transform:translate(-50%,-50%);
}

#hint {
  position:absolute;
  left:50%;
  top:57%;
  transform:translateX(-50%);
  font-size:13px;
  letter-spacing:3px;
  color:#e1eafa;
  text-shadow:0 2px 8px #000;
  white-space:nowrap;
}

#bottom {
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  width:90%;
  font-size:12px;
  letter-spacing:2px;
  color:#d2ddeb;
  text-shadow:0 2px 8px #000;
}

#overlay {
  position:fixed;
  inset:0;
  background:linear-gradient(180deg,#101a2acc,#101a2aee);
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:24px;
}

.panel {
  max-width:600px;
  width:100%;
  padding:40px 25px;
  border:1px solid #a9c2df55;
  background:#17263bd9;
  backdrop-filter:blur(15px);
}

.eyebrow {
  font-size:11px;
  letter-spacing:6px;
  color:#a9c2df;
}

h1 {
  font-size:clamp(30px,6vw,55px);
  font-weight:400;
  letter-spacing:8px;
  line-height:1.6;
  margin:25px 0;
}

.description {
  font-size:13px;
  line-height:2.2;
  color:#c0ccdc;
}

button {
  font-family:inherit;
  color:#e7eff9;
  background:#8da5c833;
  border:1px solid #b5c9e477;
  padding:13px 35px;
  letter-spacing:4px;
  cursor:pointer;
  transition:.3s;
}

button:hover {
  background:#8da5c877;
}

#start {
  margin-top:30px;
}

#dialogue {
  display:none;
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  padding:25px 7% 35px;
  background:linear-gradient(transparent,#0c1422 20%);
  z-index:8;
}

#dialogue-inner {
  max-width:900px;
  margin:auto;
  background:#1c2b40ed;
  border:1px solid #b5c9e455;
  padding:22px 28px;
}

#speaker {
  color:#9fbce0;
  font-size:13px;
  letter-spacing:4px;
  margin-bottom:15px;
}

#words {
  font-size:15px;
  line-height:2.2;
  min-height:55px;
}

#close {
  display:block;
  margin:15px 0 0 auto;
  padding:8px 18px;
  font-size:12px;
}

#instructions {
  position:fixed;
  left:22px;
  bottom:20px;
  z-index:6;
  background:#101927aa;
  padding:12px 16px;
  font-size:11px;
  line-height:2;
  letter-spacing:1px;
  color:#cbd7e6;
  pointer-events:none;
}

#counter {
  position:fixed;
  right:25px;
  bottom:25px;
  z-index:6;
  font-size:12px;
  letter-spacing:2px;
  color:#e0eaf5;
  text-shadow:0 2px 8px black;
  pointer-events:none;
}

@media(max-width:600px) {
  #instructions {font-size:10px;left:10px;bottom:10px}
  #counter {right:10px;bottom:10px}
  #dialogue {padding:15px}
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>

<body>

<div id="hud">
  <div id="top">
    <span>降伏十魔軍 / THE TEN DEMONS</span>
    <span>SECOND DEMON · SORROW</span>
  </div>
  <div id="crosshair"></div>
  <div id="hint"></div>
  <div id="bottom">雨一直下著。你似乎來到了一個陌生的地方。</div>
</div>

<div id="instructions">
  WASD　移動<br>
  MOUSE　轉動視角<br>
  SPACE　跳躍<br>
  E　調查物品<br>
  ESC　暫停
</div>

<div id="counter">線索：0 / 3</div>

<div id="overlay">
  <div class="panel">
    <div class="eyebrow">SECOND DEMON · SORROW</div>
    <h1>永遠不會<br>停止的雨</h1>
    <p class="description">
      你睜開雙眼，發現自己身處一座陌生城鎮。<br>
      雨水不斷落下，街道上卻空無一人。<br>
      <br>
      在這個世界裡，似乎有些東西<br>
      是人們無論如何都不願意放下的。
    </p>
    <button id="start">進入這個世界</button>
    <p class="description" style="font-size:11px;margin-top:20px">
      建議使用電腦及鍵盤操作
    </p>
  </div>
</div>

<div id="dialogue">
  <div id="dialogue-inner">
    <div id="speaker">旁白</div>
    <div id="words"></div>
    <button id="close">繼續探索</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x26374b);
scene.fog = new THREE.FogExp2(0x26374b,0.026);

const camera = new THREE.PerspectiveCamera(
  75,window.innerWidth/window.innerHeight,0.1,150
);

camera.position.set(0,1.7,8);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// 光線
scene.add(new THREE.HemisphereLight(0x9eb8d5,0x171c29,2));

const moon = new THREE.DirectionalLight(0x9bb9e8,1.6);
moon.position.set(-8,15,5);
moon.castShadow=true;
scene.add(moon);

// 地面
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120,120),
  new THREE.MeshStandardMaterial({
    color:0x273442,roughness:0.85
  })
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// 道路
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(10,100),
  new THREE.MeshStandardMaterial({
    color:0x172333,roughness:0.35,metalness:0.15
  })
);
road.rotation.x=-Math.PI/2;
road.position.y=0.012;
road.receiveShadow=true;
scene.add(road);

// 道路邊緣
for(let side of [-1,1]){
  const curb = new THREE.Mesh(
    new THREE.BoxGeometry(0.3,0.18,100),
    new THREE.MeshStandardMaterial({color:0x536071})
  );
  curb.position.set(side*5.15,0.08,0);
  scene.add(curb);
}

// 建築
const obstacles=[];

function building(x,z,w,h,d,color){
  const body=new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({
      color,roughness:0.9
    })
  );
  body.position.set(x,h/2,z);
  body.castShadow=true;
  body.receiveShadow=true;
  scene.add(body);

  const roof=new THREE.Mesh(
    new THREE.ConeGeometry(w*0.8,1.8,4),
    new THREE.MeshStandardMaterial({color:0x273142})
  );
  roof.rotation.y=Math.PI/4;
  roof.position.set(x,h+0.8,z);
  scene.add(roof);

  obstacles.push({
    minX:x-w/2-0.5,maxX:x+w/2+0.5,
    minZ:z-d/2-0.5,maxZ:z+d/2+0.5
  });

  // 窗戶
  for(let wx of [-w*0.25,w*0.25]){
    const windowMesh=new THREE.Mesh(
      new THREE.PlaneGeometry(0.7,0.9),
      new THREE.MeshBasicMaterial({
        color:0x9eb9d9,
        transparent:true,
        opacity:0.45
      })
    );
    windowMesh.position.set(x+wx,h*0.65,z-d/2-0.015);
    scene.add(windowMesh);
  }
}

building(-9,-8,7,9,8,0x344354);
building(9,-10,7,11,8,0x293c50);
building(-10,12,7,8,8,0x3b4859);
building(10,13,8,10,8,0x354354);
building(-9,30,7,12,9,0x2d3c4c);
building(10,33,8,9,9,0x344052);

// 路燈
for(let z of [-18,-3,13,29,43]){
  for(let x of [-4.5,4.5]){
    const pole=new THREE.Mesh(
      new THREE.CylinderGeometry(.07,.1,5,8),
      new THREE.MeshStandardMaterial({color:0x273444})
    );
    pole.position.set(x,2.5,z);
    scene.add(pole);

    const lamp=new THREE.PointLight(0x9ebce8,2.2,12);
    lamp.position.set(x,4.8,z);
    scene.add(lamp);

    const bulb=new THREE.Mesh(
      new THREE.SphereGeometry(.16,12,12),
      new THREE.MeshBasicMaterial({color:0xb9d6ff})
    );
    bulb.position.copy(lamp.position);
    scene.add(bulb);
  }
}

// 可調查的物件
const clues=[
  {
    name:'舊照片',
    x:-2.5,z:-7,
    color:0xa5b6c8,
    story:'這是一張已經泛黃的舊照片。照片裡的人笑得很開心。有人似乎始終停留在那段回憶裡，不願意接受它已經成為過去。'
  },
  {
    name:'停止的時鐘',
    x:2.5,z:-17,
    color:0x91a8c8,
    story:'時鐘的指針停在同一個時間。有人總是擔心尚未發生的事情，不斷想像最壞的結果，卻忘了自己正活在當下。'
  },
  {
    name:'遺失的行李箱',
    x:-2,z:-28,
    color:0xb4a9a0,
    story:'行李箱裡裝著一些舊物品。主人已經離開很久了，卻始終沒有回來取走。或許，他並不是忘記了，而是不知道該如何放下。'
  }
];

const interactables=[];

clues.forEach((item,i)=>{
  const group=new THREE.Group();
  group.position.set(item.x,0,item.z);

  const box=new THREE.Mesh(
    new THREE.BoxGeometry(.85,.6,.6),
    new THREE.MeshStandardMaterial({
      color:item.color,
      roughness:.5,
      metalness:.2
    })
  );
  box.position.y=.35;
  box.castShadow=true;
  group.add(box);

  const glow=new THREE.PointLight(item.color,1.5,4);
  glow.position.y=1.5;
  group.add(glow);

  const marker=new THREE.Mesh(
    new THREE.TorusGeometry(.55,.025,8,32),
    new THREE.MeshBasicMaterial({
      color:item.color,
      transparent:true,
      opacity:.75
    })
  );
  marker.rotation.x=Math.PI/2;
  marker.position.y=1.15;
  group.add(marker);

  scene.add(group);

  interactables.push({
    ...item,group,marker,found:false
  });
});

// 雨滴
const rainCount=2400;
const rainPositions=new Float32Array(rainCount*3);

for(let i=0;i<rainCount;i++){
  rainPositions[i*3]=(Math.random()-.5)*65;
  rainPositions[i*3+1]=Math.random()*30;
  rainPositions[i*3+2]=(Math.random()-.5)*80;
}

const rainGeometry=new THREE.BufferGeometry();
rainGeometry.setAttribute(
  'position',
  new THREE.BufferAttribute(rainPositions,3)
);

const rain=new THREE.Points(
  rainGeometry,
  new THREE.PointsMaterial({
    color:0xb4c9e3,
    size:.065,
    transparent:true,
    opacity:.55
  })
);
scene.add(rain);

// 玩家操作
let yaw=0;
let pitch=0;
let velocityY=0;
let grounded=true;
let started=false;
let locked=false;
let currentTarget=null;

const keys={};
const clock=new THREE.Clock();

const hint=document.getElementById('hint');
const overlay=document.getElementById('overlay');
const dialogue=document.getElementById('dialogue');

function startGame(){
  renderer.domElement.requestPointerLock();
}

document.getElementById('start').onclick=startGame;

document.addEventListener('pointerlockchange',()=>{
  locked=document.pointerLockElement===renderer.domElement;
  if(locked){
    started=true;
    overlay.style.display='none';
  }else if(started && dialogue.style.display!=='block'){
    overlay.style.display='flex';
    overlay.querySelector('h1').textContent='暫停探索';
    overlay.querySelector('.description').innerHTML=
      '你暫時離開了這個世界。<br>準備好後，重新進入探索。';
    document.getElementById('start').textContent='繼續探索';
  }
});

document.addEventListener('mousemove',(e)=>{
  if(!locked)return;
  yaw-=e.movementX*0.002;
  pitch-=e.movementY*0.002;
  pitch=Math.max(-1.45,Math.min(1.45,pitch));
});

document.addEventListener('keydown',(e)=>{
  keys[e.code]=true;

  if(e.code==='Space'){
    e.preventDefault();
    if(grounded && locked){
      velocityY=7.2;
      grounded=false;
    }
  }

  if(e.code==='KeyE' && locked){
    interact();
  }
});

document.addEventListener('keyup',(e)=>{
  keys[e.code]=false;
});

function showDialogue(title,text){
  dialogue.style.display='block';
  document.getElementById('speaker').textContent=title;
  document.getElementById('words').textContent=text;
  document.exitPointerLock();
}

document.getElementById('close').onclick=()=>{
  dialogue.style.display='none';
  if(started)renderer.domElement.requestPointerLock();
};

function interact(){
  if(!currentTarget)return;

  currentTarget.found=true;
  currentTarget.marker.material.opacity=.12;
  currentTarget.marker.scale.set(.7,.7,.7);

  showDialogue(
    '調查發現｜'+currentTarget.name,
    currentTarget.story
  );

  updateCounter();
}

function updateCounter(){
  const count=interactables.filter(x=>x.found).length;
  document.getElementById('counter').textContent=
    `線索：${count} / ${interactables.length}`;

  if(count===3){
    document.getElementById('bottom').textContent=
      '所有線索已經收集。你開始理解這個世界的秘密。';
  }
}

// 碰撞判斷
function blocked(x,z){
  if(Math.abs(x)>19 || z>9 || z<-42)return true;

  return obstacles.some(o=>
    x>o.minX && x<o.maxX &&
    z>o.minZ && z<o.maxZ
  );
}

// 更新
function animate(){
  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.04);
  const time=clock.elapsedTime;

  if(locked && dialogue.style.display!=='block'){
    const speed=5.5*dt;

    const forward=new THREE.Vector3(
      -Math.sin(yaw),0,-Math.cos(yaw)
    );

    const right=new THREE.Vector3(
      Math.cos(yaw),0,-Math.sin(yaw)
    );

    const move=new THREE.Vector3();

    if(keys.KeyW)move.add(forward);
    if(keys.KeyS)move.sub(forward);
    if(keys.KeyD)move.add(right);
    if(keys.KeyA)move.sub(right);

    if(move.lengthSq()>0){
      move.normalize().multiplyScalar(speed);

      const nx=camera.position.x+move.x;
      const nz=camera.position.z+move.z;

      if(!blocked(nx,camera.position.z))
        camera.position.x=nx;

      if(!blocked(camera.position.x,nz))
        camera.position.z=nz;
    }

    velocityY-=18*dt;
    camera.position.y+=velocityY*dt;

    if(camera.position.y<1.7){
      camera.position.y=1.7;
      velocityY=0;
      grounded=true;
    }

    camera.rotation.order='YXZ';
    camera.rotation.y=yaw;
    camera.rotation.x=pitch;
  }

  // 尋找最近的調查物件
  currentTarget=null;
  let nearest=3.2;

  if(locked && dialogue.style.display!=='block'){
    for(const item of interactables){
      if(item.found)continue;

      const dx=camera.position.x-item.x;
      const dz=camera.position.z-item.z;
      const distance=Math.sqrt(dx*dx+dz*dz);

      if(distance<nearest){
        nearest=distance;
        currentTarget=item;
      }
    }
  }

  if(currentTarget){
    hint.textContent='[ E ] 調查 '+currentTarget.name;
  }else{
    hint.textContent='';
  }

  // 雨滴下降
  const positions=rain.geometry.attributes.position.array;

  for(let i=0;i<rainCount;i++){
    positions[i*3+1]-=18*dt;

    if(positions[i*3+1]<0){
      positions[i*3+1]=30;
      positions[i*3]=camera.position.x+(Math.random()-.5)*65;
      positions[i*3+2]=camera.position.z+(Math.random()-.5)*65;
    }
  }

  rain.geometry.attributes.position.needsUpdate=true;

  // 物件微微浮動
  interactables.forEach((item,i)=>{
    if(!item.found){
      item.marker.position.y=1.15+
        Math.sin(time*2+i)*.12;
      item.marker.rotation.z=time*.4;
    }
  });

  renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
