
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>降伏十魔軍｜永遠不會停止的雨</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&display=swap');

:root {
  --blue: #8da5c8;
  --dark: #111a2b;
  --white: #e9edf4;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101827;
  color: var(--white);
  font-family: 'Noto Serif TC', serif;
  overflow: hidden;
}

button {
  font-family: inherit;
  cursor: pointer;
}

#stage {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 600px;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 45%, #52657d 0%, transparent 55%),
    linear-gradient(180deg, #28374b, #111a2b 90%);
  transition: background 1.5s;
}

#stage::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 80%, #8da5c822, transparent 40%),
    linear-gradient(90deg, #09111c88, transparent 50%, #09111c88);
  pointer-events: none;
}

#fog {
  position: absolute;
  inset: -30%;
  background:
    radial-gradient(ellipse, #dce7f022, transparent 60%);
  filter: blur(45px);
  animation: fogMove 15s infinite alternate ease-in-out;
  pointer-events: none;
}

@keyframes fogMove {
  from { transform: translateX(-5%) translateY(2%); }
  to { transform: translateX(8%) translateY(-3%); }
}

.rain {
  position: absolute;
  inset: -100px 0 0;
  pointer-events: none;
  opacity: .35;
  background-image:
    repeating-linear-gradient(
      105deg,
      transparent 0px,
      transparent 18px,
      #dce9f4 19px,
      transparent 20px
    );
  background-size: 35px 90px;
  animation: rainfall .45s linear infinite;
}

@keyframes rainfall {
  to { background-position: 0 90px; }
}

#topbar {
  position: absolute;
  top: 24px;
  left: 5%;
  right: 5%;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  letter-spacing: 3px;
  color: #d0d9e8;
}

#chapter {
  color: #b8c9df;
}

#progress {
  width: 100px;
  height: 2px;
  background: #ffffff30;
  margin-top: 8px;
}

#progress-fill {
  width: 0%;
  height: 100%;
  background: #dce8f6;
  transition: width .5s;
}

#scene {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

#title-screen {
  text-align: center;
  z-index: 5;
  animation: appear 2s ease;
}

.eyebrow {
  font-size: 12px;
  letter-spacing: 7px;
  color: #c5d4e7;
  margin-bottom: 28px;
}

h1 {
  font-size: clamp(34px, 6vw, 70px);
  font-weight: 400;
  letter-spacing: 12px;
  line-height: 1.5;
  margin: 0;
  text-shadow: 0 0 30px #a9c4e855;
}

.subtitle {
  font-size: 13px;
  letter-spacing: 5px;
  color: #b9c8dc;
  margin-top: 24px;
}

.start-button {
  margin-top: 65px;
  padding: 14px 42px;
  color: #e9eff8;
  background: #829ab333;
  border: 1px solid #c5d4e766;
  letter-spacing: 5px;
  transition: .4s;
}

.start-button:hover {
  background: #8da5c866;
  box-shadow: 0 0 25px #a9c4e855;
}

#dialogue-area {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 20px 6% 34px;
  z-index: 8;
  background: linear-gradient(transparent, #080f1beF 25%);
}

#dialogue-box {
  max-width: 1000px;
  min-height: 155px;
  margin: auto;
  padding: 22px 30px;
  background: #18263acc;
  border: 1px solid #a8bdd533;
  backdrop-filter: blur(12px);
  position: relative;
}

#speaker {
  color: #a9c4e8;
  font-size: 13px;
  letter-spacing: 4px;
  margin-bottom: 14px;
}

#dialogue {
  font-size: 16px;
  line-height: 2.1;
  letter-spacing: 1px;
  min-height: 60px;
}

#next {
  position: absolute;
  bottom: 15px;
  right: 24px;
  color: #cbd8e8;
  border: none;
  background: transparent;
  letter-spacing: 3px;
  font-size: 12px;
}

#next:hover {
  color: white;
}

#explore {
  position: absolute;
  inset: 10% 5% 220px;
  display: none;
  z-index: 4;
}

.scene-title {
  text-align: center;
  font-size: 22px;
  letter-spacing: 8px;
  color: #e1e8f2;
  text-shadow: 0 0 15px #a9c4e8;
}

.scene-hint {
  text-align: center;
  font-size: 12px;
  letter-spacing: 3px;
  color: #aebed0;
  margin-top: 12px;
}

.objects {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 15px;
  display: flex;
  justify-content: center;
  align-items: end;
  gap: clamp(12px, 5vw, 65px);
  flex-wrap: wrap;
}

.object {
  width: 105px;
  height: 125px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: #dce6f3;
  border: 1px solid #b5c7de44;
  background: #18263b99;
  backdrop-filter: blur(5px);
  transition: .4s;
}

.object:hover {
  transform: translateY(-10px);
  background: #8da5c855;
  border-color: #d9e5f5;
}

.object .symbol {
  font-size: 32px;
}

.object small {
  font-size: 11px;
  letter-spacing: 2px;
}

.object.done {
  opacity: .45;
  border-color: #9db9d9;
}

#clue-count {
  position: absolute;
  top: 65px;
  right: 20px;
  color: #dce8f4;
  font-size: 12px;
  letter-spacing: 2px;
}

#continue-area {
  text-align: center;
  margin-top: 20px;
}

.action-button {
  background: transparent;
  color: #dce8f4;
  border: 1px solid #9eb4d0;
  padding: 10px 25px;
  letter-spacing: 3px;
  transition: .3s;
}

.action-button:hover {
  background: #8da5c844;
}

#ending {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 6;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: #111a2bd9;
  backdrop-filter: blur(8px);
  padding: 30px;
}

#ending h2 {
  font-size: 40px;
  letter-spacing: 10px;
  font-weight: 400;
}

#ending p {
  font-size: 15px;
  line-height: 2.5;
  color: #d2dbea;
  max-width: 620px;
  margin: 30px auto;
}

#ending strong {
  color: #b9d2f0;
  font-weight: 500;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@media(max-width:600px) {
  #dialogue-area { padding: 10px 12px 20px; }
  #dialogue-box { padding: 18px 18px 35px; }
  #dialogue { font-size: 14px; }
  .object { width: 75px; height: 95px; }
  .object .symbol { font-size: 25px; }
  .objects { gap: 9px; }
  h1 { letter-spacing: 5px; }
  #explore { inset: 12% 3% 220px; }
}
</style>
</head>

<body>
<div id="stage">
  <div id="fog"></div>
  <div class="rain"></div>

  <div id="topbar">
    <div>降伏十魔軍　/　THE TEN DEMONS</div>
    <div>
      <div id="chapter">PROLOGUE</div>
      <div id="progress"><div id="progress-fill"></div></div>
    </div>
  </div>

  <div id="scene">
    <div id="title-screen">
      <div class="eyebrow">SECOND DEMON · SORROW</div>
      <h1>永遠不會<br>停止的雨</h1>
      <div class="subtitle">有些事情，真的能夠放下嗎？</div>
      <button class="start-button" onclick="startStory()">進入劇場</button>
    </div>
  </div>

  <div id="explore">
    <div class="scene-title" id="scene-heading">沉默的城鎮</div>
    <div class="scene-hint" id="scene-hint">點擊場景中的物品，尋找線索</div>
    <div id="clue-count"></div>
    <div class="objects" id="objects"></div>
    <div id="continue-area"></div>
  </div>

  <div id="dialogue-area" style="display:none">
    <div id="dialogue-box">
      <div id="speaker">旁白</div>
      <div id="dialogue"></div>
      <button id="next" onclick="nextDialogue()">下一段　⌄</button>
    </div>
  </div>

  <div id="ending">
    <div>
      <div class="eyebrow">SECOND DEMON · SORROW</div>
      <h2>雨停了。</h2>
      <p>
        你終於明白，真正困住一個人的，
        往往不是已經失去的東西，而是始終不願放下的心。<br><br>
        憂愁魔所代表的，是對過去的遺憾、對未來的擔憂，
        以及對已經擁有或尚未得到之物的患得患失。<br><br>
        <strong>布施，不只是給予物品，更是練習放下執著。</strong><br><br>
        當心不再緊緊抓住一切，才能重新看見眼前的世界。
      </p>
      <h2 style="font-size:25px;color:#a9c4e8">憂愁魔 → 坦然放下之利</h2>
      <button class="start-button" onclick="location.reload()">重新體驗</button>
    </div>
  </div>
</div>

<script>
const stage = document.getElementById("stage");
const dialogueArea = document.getElementById("dialogue-area");
const dialogue = document.getElementById("dialogue");
const speaker = document.getElementById("speaker");
const explore = document.getElementById("explore");
const objects = document.getElementById("objects");
const next = document.getElementById("next");

let chapter = 0;
let line = 0;
let clueSet = new Set();
let currentLines = [];
let currentScene = "";
let waitingForExplore = false;

const stories = {
  opening: [
    ["旁白","你睜開雙眼。"],
    ["旁白","四周一片陌生，空氣中瀰漫著潮濕的氣味。"],
    ["旁白","雨水不斷落下，街道上卻沒有任何行人。"],
    ["旁白","你不知道自己為什麼會來到這裡。"],
    ["旁白","遠方，一座小鎮的燈光若隱若現。"],
    ["旁白","似乎有人正在等待著你。"]
  ],
  town: [
    ["旁白","你走進了城鎮。"],
    ["旁白","這裡的人們都低著頭，緊緊抱著自己的東西。"],
    ["旁白","有人抱著錢財，有人握著工作證，還有人始終望著一張舊照片。"],
    ["旁白","奇怪的是，即使雨水打濕了全身，他們也不願意鬆開雙手。"],
    ["旁白","你決定靠近他們，看看究竟發生了什麼事。"]
  ],
  collector: [
    ["旁白","沿著街道走到底，你發現一間沒有上鎖的房間。"],
    ["旁白","房間裡坐著一位收藏家。"],
    ["收藏家","別碰那些東西……它們對我很重要。"],
    ["旁白","他不斷清點收藏品，反覆確認門鎖，彷彿只要稍不注意，就會失去一切。"],
    ["旁白","你開始調查這個房間。"]
  ],
  truth: [
    ["旁白","你逐漸拼湊出收藏家的心事。"],
    ["收藏家","我曾經失去過重要的東西……所以現在，我不能再失去任何東西。"],
    ["收藏家","可是，我越想保住它們，就越害怕有一天它們會消失。"],
    ["旁白","你終於明白，他真正害怕的，不只是失去物品。"],
    ["旁白","而是那種無法掌握未來、無法接受失去的感覺。"],
    ["旁白","你可能會想，憂愁不就是心情不好、遇到煩惱嗎？"],
    ["旁白","可是，這裡的憂愁並不只是這些。"],
    ["旁白","它讓人被過去的遺憾牽絆，也讓人因為尚未發生的事情而不安。"],
    ["旁白","明明身處現在，心卻始終停留在過去，或擔心著未來。"]
  ],
  giving: [
    ["收藏家","如果我願意把東西分享出去……是不是就代表我會失去它？"],
    ["旁白","你看著他緊握的雙手，想起了這一路上遇見的人。"],
    ["旁白","也許，真正的改變並不是得到更多，而是學習不再被擁有與失去束縛。"],
    ["旁白","你向收藏家提出了一個建議。"],
    ["你","或許可以試著把一部分東西分享給真正需要的人。"],
    ["收藏家","分享……？"],
    ["旁白","他猶豫了很久，終於將一件物品交給了需要幫助的人。"],
    ["旁白","那一刻，他第一次沒有急著確認自己還剩下多少。"],
    ["旁白","布施，讓人練習給予，也讓心慢慢學會放下執著。"]
  ]
};

function showDialogue(lines, callback) {
  currentLines = lines;
  line = 0;
  waitingForExplore = false;
  dialogueArea.style.display = "block";
  explore.style.display = "none";
  document.getElementById("title-screen").style.display = "none";
  document.getElementById("ending").style.display = "none";
  showLine();
  next.onclick = () => {
    if (line < currentLines.length - 1) {
      line++;
      showLine();
    } else {
      dialogueArea.style.display = "none";
      if (callback) callback();
    }
  };
}

function showLine() {
  speaker.textContent = currentLines[line][0];
  dialogue.textContent = currentLines[line][1];
  document.getElementById("progress-fill").style.width =
    Math.min(100, (chapter * 17 + line * 2) ) + "%";
}

function nextDialogue() {
  next.onclick();
}

function startStory() {
  chapter = 1;
  document.getElementById("chapter").textContent = "PROLOGUE";
  showDialogue(stories.opening, showTown);
}

function showTown() {
  chapter = 2;
  document.getElementById("chapter").textContent = "CHAPTER 01";
  showDialogue(stories.town, () => {
    showExplore(
      "沉默的城鎮",
      [
        ["💰","金錢","他害怕失去僅有的積蓄。"],
        ["▣","工作識別證","他擔心有一天會失去工作，失去生活的保障。"],
        ["🏆","獎盃","他始終抓著過去的成就，害怕自己不再被肯定。"],
        ["♡","舊相框","她放不下曾經的感情，總在回憶裡尋找答案。"]
      ],
      () => showCollector()
    );
  });
}

function showCollector() {
  chapter = 3;
  document.getElementById("chapter").textContent = "CHAPTER 02";
  showDialogue(stories.collector, () => {
    showExplore(
      "收藏家的房間",
      [
        ["🔒","門鎖","他反覆確認門鎖，害怕有任何東西在自己不知道的時候消失。"],
        ["📦","收藏箱","箱子裡裝滿了他不願意失去的東西。"],
        ["🕰","時鐘","他總是想著過去發生的事，以及未來可能發生的事。"]
      ],
      () => showTruth()
    );
  });
}

function showExplore(title, items, callback) {
  currentScene = title;
  clueSet = new Set();
  explore.style.display = "block";
  dialogueArea.style.display = "none";
  document.getElementById("scene-heading").textContent = title;
  document.getElementById("scene-hint").textContent = "點擊物品，調查背後的故事";
  objects.innerHTML = "";
  document.getElementById("continue-area").innerHTML = "";
  updateClueCount(items.length);

  items.forEach((item,index) => {
    const button = document.createElement("button");
    button.className = "object";
    button.innerHTML = `
      <span class="symbol">${item[0]}</span>
      <small>${item[1]}</small>
    `;
    button.onclick = () => {
      if (clueSet.has(index)) return;
      clueSet.add(index);
      button.classList.add("done");
      updateClueCount(items.length);
      showInspection(item[1],item[2]);
      if (clueSet.size === items.length) {
        document.getElementById("scene-hint").textContent =
          "線索已全部收集完成";
        document.getElementById("continue-area").innerHTML =
          '<button class="action-button" onclick="finishExplore()">繼續故事 →</button>';
      }
    };
    objects.appendChild(button);
  });

  window.afterExplore = callback;
}

function updateClueCount(total) {
  document.getElementById("clue-count").textContent =
    "線索 " + clueSet.size + " / " + total;
}

function showInspection(name, description) {
  speaker.textContent = "調查發現｜" + name;
  dialogue.textContent = description;
  dialogueArea.style.display = "block";
  next.textContent = "返回探索";
  next.onclick = () => {
    dialogueArea.style.display = "none";
    next.textContent = "下一段　⌄";
  };
}

function finishExplore() {
  explore.style.display = "none";
  dialogueArea.style.display = "none";
  next.textContent = "下一段　⌄";
  if (window.afterExplore) window.afterExplore();
}

function showTruth() {
  chapter = 4;
  document.getElementById("chapter").textContent = "CHAPTER 03";
  showDialogue(stories.truth, showGiving);
}

function showGiving() {
  chapter = 5;
  document.getElementById("chapter").textContent = "CHAPTER 04";
  showDialogue(stories.giving, () => {
    document.getElementById("chapter").textContent = "EPILOGUE";
    document.getElementById("progress-fill").style.width = "100%";
    document.getElementById("ending").style.display = "flex";
  });
}
</script>
</body>
</html>
